name: pawsie_diary
description: Pawsie Diary - a cosy private diary with Mochi the cat.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  # encryption at rest
  cryptography: ^2.7.0
  flutter_secure_storage: '>=9.2.0 <12.0.0'
  # fingerprint / face unlock
  local_auth: ^3.0.0
  # daily reminders
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  # PDF export
  pdf: '>=3.11.0 <4.0.0'
  printing: '>=5.13.0 <6.0.0'
  # optional online features (Google / Apple sign-in, password reset, encrypted backup)
  firebase_core: '>=4.0.0 <8.0.0'
  firebase_auth: '>=6.0.0 <10.0.0'
  cloud_firestore: '>=6.0.0 <10.0.0'
  google_sign_in: '>=7.0.0 <8.0.0' # native Google account picker

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
